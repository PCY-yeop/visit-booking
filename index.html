<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예약정리 — 문자 붙여넣기 예약 장부</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E6B4F">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EFE9; --card:#FFFFFF; --ink:#20241F; --sub:#6E756D; --line:#E3E0D5;
  --green:#0E6B4F; --deep:#0B4A37; --green-soft:#E4EFE7;
  --red:#C25543; --red-soft:#F7E9E4;
  --amber:#A8742C; --amber-soft:#F6EEDD;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;color:var(--ink);background:#E7E4DB;min-height:100dvh;display:flex;justify-content:center}
.num{font-variant-numeric:tabular-nums}
#frame{width:100%;max-width:430px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(30,40,30,.10)}
@media(min-width:920px){
  #frame{max-width:1080px;margin:20px auto;min-height:calc(100dvh - 40px);border-radius:26px;overflow:hidden}
}
@media(min-width:520px) and (max-width:919px){#frame{margin:20px auto;min-height:calc(100dvh - 40px);border-radius:26px;overflow:hidden}}
@media(min-width:920px){#frame{max-width:1080px}}

/* 헤더 */
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:16px 18px 10px;display:flex;align-items:center;gap:10px}
header .logo{width:34px;height:34px;border-radius:10px;background:var(--deep);display:grid;place-items:center;flex:none}
header h1{font-family:'Gowun Batang',serif;font-size:20px;font-weight:700;letter-spacing:-.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{font:inherit;font-size:12px;font-weight:700;color:var(--sub);background:none;border:1px solid var(--line);border-radius:99px;padding:6px 11px;cursor:pointer;white-space:nowrap}
header button.install{color:var(--green);border-color:var(--green)}
.upd{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(15,23,18,.45);padding:24px}
.upd.on{display:grid}
.upd-card{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:300px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.25);animation:updPop .25s ease}
@keyframes updPop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.upd-ic{width:54px;height:54px;margin:0 auto 12px;border-radius:16px;background:rgba(14,107,79,.09);display:grid;place-items:center;color:var(--green)}

/* 상태 지정 버튼 — 4개 동일 구조, 상태색만 구분 */
.st-btn{width:100%;font:inherit;font-size:14px;font-weight:800;padding:12px;border-radius:11px;border:1.5px solid;background:var(--card);cursor:pointer}
.st-btn:active{transform:scale(.98)}
.st-btn.p{border-color:var(--green);color:var(--green)}
.st-btn.d{border-color:var(--deep);color:var(--deep)}
.st-btn.c{border-color:var(--amber);color:var(--amber)}
.st-btn.x{border-color:var(--red);color:var(--red)}
/* 섹션 메뉴 버튼 (1행 50/50 · 2행 1/3) */
.menu-row{display:grid;gap:10px;margin-top:10px}
.menu-row.r1{grid-template-columns:1fr 1fr}
.menu-row.r2{grid-template-columns:1fr 1fr 1fr}
.menu-tile{font:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;box-shadow:0 1px 2px rgba(30,40,30,.05)}
.menu-tile .mt{font-family:'Gowun Batang',serif;font-size:14.5px;font-weight:700;color:var(--ink)}
.menu-tile.on{border-color:var(--deep);background:var(--deep)}
.menu-tile.on .mt{color:#fff}
.sec-line{font-size:11px;font-weight:800;color:var(--sub);margin:12px 2px 0}
.page{display:none}
.page.on{display:block;padding:2px 2px 0}



main{flex:1;padding:0 12px 110px;overflow:visible}
h2.sec{font-family:'Gowun Batang',serif;font-size:15px;font-weight:700;color:var(--deep);margin:14px 4px 8px;display:flex;align-items:center;gap:8px}
h2.sec .cnt{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:11px;font-weight:800;background:var(--green-soft);color:var(--green);border-radius:99px;padding:3px 8px}

.filterchip{display:none;align-items:center;gap:6px;margin:8px 2px 0;font-size:12.5px;font-weight:700;color:#fff;background:var(--green);border:none;border-radius:99px;padding:6px 12px;cursor:pointer}
.filterchip.on{display:inline-flex}

/* 예약 행 */
.r-item{background:var(--card);border-radius:14px;margin-top:8px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 2px rgba(30,40,30,.05);cursor:pointer;border:1.5px solid transparent}
.r-item:active{border-color:var(--green)}
.r-item.done{opacity:.55}
.tchip{flex:none;width:auto;min-width:70px;max-width:94px;background:var(--deep);color:#fff;border-radius:9px;text-align:center;padding:7px 6px;line-height:1.25;overflow:hidden}
.tchip .d{font-size:10.5px;font-weight:600;opacity:.75;display:block}
.tchip .tt{font-size:10.5px;font-weight:800;display:block;word-break:break-word;letter-spacing:-.2px}
.r-info{flex:1;min-width:0}
.r-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.r-name .site{font-size:11px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.r-meta{font-size:12.5px;color:var(--sub);margin-top:2px}
.r-acts{display:flex;flex-direction:row;align-items:center;gap:7px}
.r-acts button{font:inherit;font-size:11px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:5px 9px;cursor:pointer}
.stbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--green);background:var(--card);color:var(--green);cursor:pointer;display:grid;place-items:center}
.stbtn:active{background:var(--green-soft)}
.stbtn.memoed{background:var(--green);color:#fff}
.badge-cx{font-size:10px;font-weight:800;color:var(--red);background:var(--red-soft);border-radius:6px;padding:2px 6px}
.r-review{font-size:12px;color:var(--deep);margin-top:3px;line-height:1.5}
.r-review .lb{font-weight:800;color:var(--green)}
.r-review .cx{color:var(--red);font-weight:800}
.memo-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.memo-tabs button{font:inherit;font-size:12.5px;font-weight:800;padding:9px 0;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.memo-tabs button.on{background:var(--deep);border-color:var(--deep);color:#fff}
#msheet textarea{width:100%;font:inherit;font-size:13.5px;line-height:1.6;padding:12px 14px;border:1.5px dashed #C9C5B8;border-radius:12px;height:110px;min-height:110px;max-height:110px;resize:none;background:var(--card);outline:none;font-family:inherit}
#msheet textarea:focus{border-color:var(--green);border-style:solid}
.past{filter:grayscale(.4)}

/* 캘린더 */
.cal{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(30,40,30,.05)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .mon{font-family:'Gowun Batang',serif;font-size:18px;font-weight:700}
.cal-head button{font:inherit;width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-grid .hd{font-size:10.5px;font-weight:800;color:var(--sub);text-align:center;padding:4px 0}
.cal-grid .hd.sun{color:var(--red)}
.cell{position:relative;min-height:46px;border-radius:9px;background:transparent;border:1.5px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:4px}
.cell:hover{background:var(--bg)}
.cell.out{opacity:.32}
.cell.today .dn{background:var(--deep);color:#fff}
.cell.sel{border-color:var(--green);background:var(--green-soft)}
.cell .dn{font-size:12.5px;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.cell .cn{font-size:9px;font-weight:800;color:var(--green);line-height:1;margin-top:1px}
.cell .tm{font-size:8.5px;font-weight:800;color:var(--green);line-height:1}
.daypanel{margin-top:10px;display:none}
.daypanel.on{display:block}
.daypanel .dp-h{font-size:13px;font-weight:800;margin:2px 2px 6px;color:var(--deep)}

/* 빈 상태 */
input::placeholder{color:rgba(120,120,120,.55);opacity:1}
input::-webkit-input-placeholder{color:rgba(120,120,120,.55);opacity:1}
.empty{text-align:center;color:var(--sub);font-size:13px;line-height:1.8;padding:36px 12px;border:1.5px dashed var(--line);border-radius:14px;margin-top:10px;background:rgba(255,255,255,.5)}
.empty b{color:var(--green)}

/* FAB */
.fab{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:15;background:var(--deep);color:#fff;border:none;border-radius:99px;padding:15px 26px;font:inherit;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(11,74,55,.35);display:flex;align-items:center;gap:8px}
@media(min-width:920px){.fab{left:auto;right:34px;transform:none}}
.fab:active{transform:translateX(-50%) scale(.97)}
#frame:not(.in) .fab{display:none}
@media(min-width:920px){.fab:active{transform:scale(.97)}}

/* 시트 */
#sheet,#ssheet,#msheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.on,#ssheet.on,.on,#msheet.on{display:block}
#sheet .dim,#ssheet .dim, .dim,#msheet .dim{position:absolute;inset:0;background:rgba(30,40,30,.45)}
#sheet .panel,#ssheet .panel, .panel,#msheet .panel{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 20px 30px;animation:up .25s cubic-bezier(.2,.8,.3,1);max-height:92dvh;overflow-y:auto}
@media(min-width:520px){#sheet .panel,#ssheet .panel, .panel,#msheet .panel{border-radius:22px;bottom:50%;transform:translate(-50%,50%)}}
@media(min-width:920px){#sheet .panel{max-width:560px}}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sl-head h3{font-family:'Gowun Batang',serif;font-size:17px}
.sl-head button{font:inherit;font-size:12px;font-weight:700;color:var(--sub);background:none;border:none;cursor:pointer}
.sl-note{font-size:12.5px;color:var(--sub);line-height:1.6;margin-bottom:10px}
.sl-note b{color:var(--green)}
textarea#raw{width:100%;font:inherit;font-size:13.5px;line-height:1.6;padding:12px 14px;border:1.5px dashed #C9C5B8;border-radius:12px;min-height:110px;resize:vertical;background:var(--card);outline:none;font-family:inherit}
textarea#raw:focus{border-color:var(--green);border-style:solid}
.sl-actions{display:flex;gap:8px;margin:10px 0 4px}
.sl-actions .btn{flex:1}
.btn{font:inherit;font-size:14px;font-weight:800;padding:12px;border-radius:11px;border:none;cursor:pointer}
.btn-primary{background:var(--deep);color:#fff}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--sub)}
.frm{display:none;flex-direction:column;gap:10px;margin-top:12px}
.frm.on{display:flex}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f input{width:100%}
.f input[type=date]{-webkit-min-logical-width:100%;min-width:100%}
.f label{font-size:11.5px;font-weight:800;color:var(--sub)}
.f input{font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);outline:none}
.f input:focus{border-color:var(--green)}
.parsed-ok{display:none;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--green);margin-top:8px}
.parsed-ok.on{display:flex}

/* 설치 안내 (아이폰 등 브라우저 설치 미지원 시 안내용) */
#install-ios{display:none;font-size:12.5px;color:var(--deep);line-height:1.7}

/* 로그인 화면 */
#view-login{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:32px 28px;gap:12px}
#view-login.hide{display:none}
.lg-mark{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
.lg-mark .book{width:64px;height:64px;border-radius:18px;background:var(--deep);display:grid;place-items:center;box-shadow:0 10px 22px rgba(11,74,55,.30)}
.lg-mark h1{font-family:'Gowun Batang',serif;font-size:24px;font-weight:700}
.lg-mark p{font-size:13px;color:var(--sub)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f input{width:100%}
.f input[type=date]{-webkit-min-logical-width:100%;min-width:100%}
.f label{font-size:11.5px;font-weight:800;color:var(--sub)}
.f input{font:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);outline:none}
.f input:focus{border-color:var(--green)}
.btn{font:inherit;font-size:15px;font-weight:800;padding:13px;border-radius:11px;border:none;cursor:pointer}
.btn-primary{background:var(--deep);color:#fff}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--sub)}
.btn:disabled{opacity:.5;cursor:wait}
.btn-danger{background:var(--red-soft);color:var(--red)}
.lg-err{font-size:13px;color:var(--red);text-align:center;min-height:18px}
.lg-note{font-size:12px;color:var(--sub);text-align:center;line-height:1.7}

#toast{position:fixed;bottom:92px;left:50%;transform:translate(-50%,14px);background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;z-index:50;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<div id="frame">
  <!-- 로그인 화면 (첫 페이지) -->

    <b style="font-size:16px">새 버전이 있습니다</b>
    <p style="font-size:13px;color:var(--sub);margin:6px 0 16px;line-height:1.5">지금 업데이트하면<br>최신 기능이 바로 적용됩니다</p>
    <button class="btn btn-primary" style="width:100%" onclick="applyUpdate()">지금 업데이트</button>
    <button style="width:100%;margin-top:8px;background:none;border:none;color:var(--sub);font:inherit;font-size:13px;cursor:pointer" onclick="laterUpdate()">나중에</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ────────── 데이터 (계정별 저장) ────────── */
let uid='';
const itemsKey=()=>'rsms.items.'+uid;
let items=[];
function loadItems(){
  /* 기존 로컬 기록(rsms.v1.items)이 있으면 로그인한 계정으로 이관 */
  if(uid&&localStorage.getItem(itemsKey())===null){
    const old=localStorage.getItem('rsms.v1.items');
    if(old){localStorage.setItem(itemsKey(),old);localStorage.removeItem('rsms.v1.items');}
  }
  items=JSON.parse(localStorage.getItem(itemsKey())||'[]');
  items.forEach(it=>{if(!it.status)it.status=it.done?'done':'pending';});
  items.forEach(it=>{if(!it.notes)it.notes={before:it.memo||'',after:it.review||'',contract:''};});  /* 기존 기록 상태 자동 지정 */
}
const save=()=>{if(uid)localStorage.setItem(itemsKey(),JSON.stringify(items));cloudPush();};
let editingId=null, selDate=null, calY, calM;
const $=id=>document.getElementById(id);
const todayKey=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400);}

/* ────────── 문자 파서 ────────── */
function normalizeDate(s){
  if(!s)return '';
  let m=s.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if(!m)m=s.match(/(\d{2,4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(!m)return '';
  let[,y,mo,d]=m;y=String(y).length===2?'20'+y:y;
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function normalizePhone(s){
  const n=(s||'').replace(/[^\d]/g,'');
  if(n.length===11)return n.slice(0,3)+'-'+n.slice(3,7)+'-'+n.slice(7);
  if(n.length===10)return n.slice(0,3)+'-'+n.slice(3,6)+'-'+n.slice(6);
  return s||'';
}
function normalizeTime(s){
  if(!s)return '';
  const m=s.match(/(오전|오후|am|pm)?\s*(\d{1,2})\s*시\s*(\d{1,2})?\s*분?/i);
  if(m){let h=+m[2];const ap=(m[1]||'').toLowerCase();if(ap==='오후'||ap==='pm'){if(h<12)h+=12;}else if(ap==='오전'||ap==='am'){if(h===12)h=0;}return h+':'+String(m[3]?+m[3]:0).padStart(2,'0');}
  const m2=s.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if(m2)return m2[1].padStart(2,'0')+':'+m2[2];
  return '';
}
function guessName(t){
  const m=t.match(/예약(?:자|인|자명)?\s*[:：]?\s*([가-힣]{2,4})(?=\s|$|,|님)/);
  if(m)return m[1];
  for(const x of t.matchAll(/([가-힣]{2,4})\s*님/g)){if(!/고객|손님|회원/.test(x[1]))return x[1];}
  return '';
}
function parseSms(text){
  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const rest=lines[0]&&/발신/.test(lines[0])?lines.slice(1):lines;
  const val=re=>{const l=rest.find(x=>re.test(x));return l?l.replace(re,'').replace(/^[\s:：]+/,'').trim():'';};
  let date=normalizeDate(val(/^날짜/)||'');
  if(!date){const m=text.match(/\d{4}[.\-\/년]\s?\d{1,2}[.\-\/월]\s?\d{1,2}/);if(m)date=normalizeDate(m[0]);}
  if(!date){const m=text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);if(m&&+m[1]<=12&&+m[2]<=31){const now=new Date();let c=new Date(now.getFullYear(),+m[1]-1,+m[2]);if(c<new Date(now.getFullYear(),now.getMonth(),now.getDate()))c=new Date(now.getFullYear()+1,+m[1]-1,+m[2]);date=c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0');}}
  if(!date){const dm=text.match(/오늘|내일|모레/);if(dm){const off={오늘:0,내일:1,모레:2}[dm[0]];const t2=new Date();t2.setDate(t2.getDate()+off);date=t2.getFullYear()+'-'+String(t2.getMonth()+1).padStart(2,'0')+'-'+String(t2.getDate()).padStart(2,'0');}}
  let time=val(/^시간/);
  if(!time)time=normalizeTime((text.match(/(?:오전|오후|am|pm)?\s*\d{1,2}\s*시(?:\s*\d{1,2})?\s*분?|\d{1,2}\s*:\s*\d{2}/i)||[''])[0]);
  const name=val(/^이름/)||guessName(text);
  const phoneRaw=val(/^연락처|^전화/);
  const phone=normalizePhone(phoneRaw||((text.match(/0\d{1,2}[-\s]?\d{3,4}[-\s]?\d{4}/)||[''])[0]));
  let site='';
  const siteLine=rest.find(x=>!/^날짜|^시간|^이름|^연락처|^전화|^현장/.test(x)&&!/^[^\s:：]*명\s*[:：]/.test(x)&&!/\d{4}/.test(x));
  const sl=val(/^현장명?\s*[:：]?/);
  site=(sl||(siteLine||'')).replace(/^\[|\]$/g,'').trim();
  return {site,date,time,name,phone};
}

/* ────────── 시트 ────────── */
function sheetAnyOpen(){return !!document.querySelector('#sheet.on,#msheet.on,#ssheet.on');}
function histPush(){if(!history.state||!history.state.rs){try{history.pushState({rs:1},'');}catch(_){}}}
function histPop(){if(history.state&&history.state.rs){try{history.back();}catch(_){}}}
addEventListener('popstate',()=>{if(sheetAnyOpen()){$('sheet').classList.remove('on');$('ssheet').classList.remove('on');$('msheet').classList.remove('on');}});
function openSheet(){
  editingId=null;
  $('sl-title').textContent='문자 붙여넣기';
  $('sl-note').style.display='block';
  $('raw').style.display='block';
  document.querySelector('#sheet .sl-actions').style.display='flex';
  $('p-ok').classList.remove('on');
  $('frm').classList.remove('on');
  $('del-btn').style.display='none';
  ['f-site','f-date','f-time','f-name','f-phone'].forEach(i=>$(i).value='');
  $('raw').value='';
  histPush();$('sheet').classList.add('on');
}
function closeSheet(){$('sheet').classList.remove('on');histPop();}
function analyze(){
  const text=$('raw').value.trim();
  if(!text)return toast('문자를 붙여넣어 주세요');
  const p=parseSms(text);
  $('f-site').value=p.site;$('f-date').value=p.date;$('f-time').value=p.time;
  $('f-name').value=p.name;$('f-phone').value=p.phone;
  $('p-ok').classList.add('on');$('frm').classList.add('on');
  if(!p.date)$('f-date').focus();
}
function openDirect(){
  $('p-ok').classList.remove('on');
  $('frm').classList.add('on');
  $('f-site').focus();
}
function saveItem(){
  const rec={site:$('f-site').value.trim(),date:$('f-date').value,time:$('f-time').value.trim(),name:$('f-name').value.trim(),phone:$('f-phone').value.trim(),memo:''};
  if(!(rec.date&&rec.name))return toast('날짜와 이름은 필수입니다');
  if(editingId){
    const it=items.find(x=>x.id===editingId);
    Object.assign(it,rec);toast('수정했습니다');
  }else{
    items.push({id:Date.now(),...rec,status:'pending',notes:{before:'',after:'',contract:''},createdAt:new Date().toISOString()});
    toast('예약이 기록되었습니다');
  }
  save();closeSheet();render();
}
function editItem(id){
  const it=items.find(x=>x.id===id);if(!it)return;
  editingId=id;
  $('sl-title').textContent='예약 수정';
  $('sl-note').style.display='none';
  $('raw').style.display='none';
  document.querySelector('#sheet .sl-actions').style.display='none';
  $('p-ok').classList.remove('on');
  $('f-site').value=it.site;$('f-date').value=it.date;$('f-time').value=it.time;$('f-name').value=it.name;$('f-phone').value=it.phone;
  $('frm').classList.add('on');$('del-btn').style.display='block';
  histPush();$('sheet').classList.add('on');
}
function delItem(){
  if(!editingId)return;
  const delId=editingId;
  items=items.filter(x=>x.id!==delId);
  save();cloudDel(delId);closeSheet();render();toast('삭제했습니다');
}
/* ────────── 상태 지정 & 방문 후기 ────────── */
let statusId=null,memoId=null,memoTab='before';
function hasNotes(it){return !!(it.notes&&(it.notes.before||it.notes.after||it.notes.contract));}
function openMemo(id,ev){
  ev&&ev.stopPropagation();
  const it=items.find(x=>x.id===id);if(!it)return;
  memoId=id;memoTab='before';
  $('ms-sub').innerHTML=`<b>${it.name}</b> · ${fmtK(it.date)}${it.time?' '+it.time:''}`;
  switchMemoTab('before',it);
  histPush();$('msheet').classList.add('on');
}
function switchMemoTab(t,keep){
  const cur=items.find(x=>x.id===memoId);
  if(cur&&!cur.notes)cur.notes={before:'',after:'',contract:''};
  if(cur&&!keep)cur.notes[memoTab]=$('m-text').value.trim();  /* 전환 전 임시저장 */
  memoTab=t;
  document.querySelectorAll('#memo-tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  $('m-text').value=(cur&&cur.notes&&cur.notes[t])||'';
}
function saveMemo(){
  const it=items.find(x=>x.id===memoId);if(!it)return;
  if(!it.notes)it.notes={before:'',after:'',contract:''};
  it.notes[memoTab]=$('m-text').value.trim();
  save();closeS();render();toast('메모를 저장했습니다');
}
function closeS(){$('ssheet').classList.remove('on');$('msheet').classList.remove('on');histPop();}
function openStatus(id,ev){
  ev&&ev.stopPropagation();
  const it=items.find(x=>x.id===id);if(!it)return;
  statusId=id;
  $('ss-sub').innerHTML=`<b>${it.name}</b> · ${fmtK(it.date)} ${it.time||''}<br>방문예정 · 방문완료 · 계약완료 · 방문취소 중 지정하세요`;
  histPush();$('ssheet').classList.add('on');
}
function setStatus(st){
  const it=items.find(x=>x.id===statusId);if(!it)return;
  it.status=st;save();closeS();render();
  toast(st==='done'?'방문완료 칸으로 옮겼습니다':st==='contract'?'계약 칸으로 옮겼습니다':st==='pending'?'방문예정 칸으로 옮겼습니다':'방문취소 칸으로 옮겼습니다');
}

/* ────────── 목록 ────────── */
const WKA=['일','월','화','수','목','금','토'];
function fmtK(key){const[y,m,d]=key.split('-').map(Number);const w=WKA[new Date(y,m-1,d).getDay()];return `${Number(m)}월 ${Number(d)}일 (${w})`;}
function addDays(key,n){const[y,m,d]=key.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
const startOf=r=>(r.date||'')+'T'+((r.time||'00:00').match(/\d{1,2}:\d{2}/)||['00:00'])[0];
const CHK_SVG='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>';
const MEMO_SVG='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function cardInfo(it){
  return `<div class="r-info">
    <div class="r-name">${it.name}${it.site?`<span class="site">${it.site}</span>`:''}${it.status==='canceled'?'<span class="badge-cx">취소</span>':''}</div>
    <div class="r-meta num">${it.phone||'연락처 없음'}</div>
    <div class="r-meta num">${fmtK(it.date)}${it.time?' · '+it.time:''}</div>
  </div>`;
}
function actBtns(it,kind){
  const chk=`<button class="stbtn" title="상태 지정" onclick="openStatus(${it.id},event)" aria-label="상태 지정">${CHK_SVG}</button>`;
  const memo=`<button class="stbtn${hasNotes(it)?' memoed':''}" title="메모" onclick="openMemo(${it.id},event)" aria-label="메모">${MEMO_SVG}</button>`;
  return `<div class="r-acts">${memo}${chk}</div>`;
}
function card(it,kind){return `<div class="r-item" onclick="editItem(${it.id})">${cardInfo(it)}${actBtns(it,kind)}</div>`;}
let curSec='list';
function setSec(t){
  curSec=t;
  ['list','cal','cancel','done','contract'].forEach(x=>{
    $('mt-'+x).classList.toggle('on',x===t);
    $('sec-'+x).classList.toggle('on',x===t);
  });
  if(t==='cal'){renderCal();renderDayPanel();}
}


/* ────────── 캘린더 ────────── */
function calMove(n){calM+=n;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderCal();renderDayPanel();}
function byCount(key){return items.filter(x=>x.date===key).length;}
function renderCal(){
  $('cal-title').textContent=`${calY}년 ${calM+1}월`;
  const first=new Date(calY,calM,1).getDay();
  const dim=new Date(calY,calM+1,0).getDate();
  const dimPrev=new Date(calY,calM,0).getDate();
  const tk=todayKey();
  let html=['일','월','화','수','목','금','토'].map((w,i)=>`<div class="hd${i===0?' sun':''}">${w}</div>`).join('');
  for(let i=0;i<first;i++)html+=`<div class="cell out"><span class="dn num">${dimPrev-first+i+1}</span></div>`;
  for(let d=1;d<=dim;d++){
    const key=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const c=byCount(key);
    const evs=items.filter(x=>x.date===key).sort((a,b)=>startOf(a).localeCompare(startOf(b)));
    const live=evs.filter(x=>x.status!=='canceled').length;
    html+=`<div class="cell${key===tk?' today':''}${selDate===key?' sel':''}" onclick="pickDay('${key}')" role="button" aria-label="${key}">
      <span class="dn num">${d}</span>
      ${live>0?`<span class="cn num">${live}</span>`:''}
      
    </div>`;
  }
  const tail=(7-((first+dim)%7))%7;
  for(let i=1;i<=tail;i++)html+=`<div class="cell out"><span class="dn num">${i}</span></div>`;
  $('cal-grid').innerHTML=html;
}
function pickDay(key){
  selDate=selDate===key?null:key;   /* 캘린더에 머물며 그날 예약을 아래 패널로 확인 */
  renderCal();renderDayPanel();
}
function renderDayPanel(){
  if(!selDate){$('daypanel').classList.remove('on');return;}
  const evs=items.filter(x=>x.date===selDate).sort((a,b)=>startOf(a).localeCompare(startOf(b)));
  $('daypanel').classList.add('on');
  $('daypanel').innerHTML=`<div class="dp-h">${fmtK(selDate)} 예약 ${evs.length}건</div>`+
    (evs.length?evs.map(it=>`<div class="r-item" onclick="editItem(${it.id})"><div class="tchip num"><span class="tt">${it.status==='canceled'?'취소':it.time||'시간 미지정'}</span></div><div class="r-info"><div class="r-name">${it.name}${it.site?`<span class="site">${it.site}</span>`:''}${it.status==='canceled'?'<span class="badge-cx">취소</span>':''}${it.status==='done'?'<span class="r-review" style="display:inline"><span class="lb">완료</span></span>':''}</div><div class="r-meta num">${it.phone||''}</div><div class="r-meta num">${fmtK(it.date)}${it.time?' · '+it.time:''}</div></div><div class="r-acts"><button class="stbtn${hasNotes(it)?' memoed':''}" title="메모" onclick="openMemo(${it.id},event)" aria-label="메모">${MEMO_SVG}</button></div></div>`).join(''):'<div class="empty">이 날짜의 예약이 없습니다.</div>');
}

/* ────────── 방문취소 · 방문완료 · 계약 칸 ────────── */
function renderList(){
  const tk=todayKey();
  const pend=items.filter(x=>x.status==='pending');
  const up=pend.filter(x=>x.date>=tk).sort((a,b)=>startOf(a).localeCompare(startOf(b)));
  const past=pend.filter(x=>x.date<tk).sort((a,b)=>startOf(b).localeCompare(startOf(a)));
  let html='';
  if(!items.length)html=`<div class="empty">아직 기록이 없습니다.<br>받은 예약 문자를 <b>문자 붙여넣기</b> 버튼에 그대로 복사해 넣으면<br>현장·날짜·시간·이름·연락처가 자동으로 정리됩니다.</div>`;
  else if(!up.length&&!past.length)html=`<div class="empty">예정된 예약이 없습니다.</div>`;
  if(up.length)html+=`<div class="sec-line">예정된 예약 ${up.length}건</div>`+up.map(x=>card(x,'list')).join('');
  if(past.length)html+=`<div class="sec-line">지나간 예약 ${past.length}건</div>`+past.map(x=>card(x,'list')).join('');
  $('sec-list').innerHTML=html;
}
function renderBoard(){
  const by=st=>[...items].filter(x=>x.status===st).sort((a2,b2)=>startOf(b2).localeCompare(startOf(a2)));
  const cx=by('canceled'),dn=by('done'),ct=by('contract');
  $('sec-cancel').innerHTML=cx.length?cx.map(x=>card(x,'cancel')).join(''):`<div class="empty">방문취소 기록이 없습니다.<br>목록의 체크 버튼에서 방문취소를 지정하면<br>이곳으로 옮겨집니다.</div>`;
  $('sec-done').innerHTML=dn.length?dn.map(x=>card(x,'done')).join(''):`<div class="empty">방문 완료 기록이 없습니다.<br>목록의 체크 버튼에서 방문완료를 지정하면<br>이곳으로 옮겨집니다.</div>`;
  $('sec-contract').innerHTML=ct.length?ct.map(x=>card(x,'contract')).join(''):`<div class="empty">계약 완료 기록이 없습니다.<br>목록의 체크 버튼에서 계약완료를 지정하면<br>이곳으로 옮겨집니다.</div>`;
}

/* ────────── 전체 렌더 ────────── */
function render(){
  renderList();renderBoard();renderCal();renderDayPanel();
}


/* ────────── 백업 함수 (로그인 도입 시 UI와 함께 재사용) ────────── */
function exportData(){
  const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='예약정리-백업-'+todayKey()+'.json';a.click();URL.revokeObjectURL(a.href);
  toast('백업 파일을 저장했습니다');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;items=d;save();render();toast('백업을 불러왔습니다');}catch{toast('올바른 백업 파일이 아닙니다');}};
  r.readAsText(f);
}

/* ────────── PWA 설치 (상단 [앱 설치] 버튼) ────────── */
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
$('install-btn').addEventListener('click',()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();

async function cloudSync(){
  if(!sb||!uid)return;
  try{
    let all=[],from=0;
    for(;;){
      const{data,error}=await sb.from('reservations').select('*').range(from,from+999);

      all=all.concat(data||[]);
      if(!data||data.length<1000)break;

    }
    cloudOn=true;
    const map=new Map(all.map(r=>[Number(r.id),cRev(r)]));
    const up=[];
    items.forEach(l=>{
      const c=map.get(l.id);
      if(!c){up.push(cRow(l));return;}
      const lt=l.updatedAt||l.createdAt||'',ct=c.updatedAt||c.createdAt||'';
      if(lt>ct)up.push(cRow(l));else map.set(l.id,c);

/* ────────── 엑셀 저장 (의존성 없는 최소 XLSX 생성기) ────────── */ /*XLSX_BEGIN*/
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function xlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const d=new Date();
  const dTime=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  const dDate=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  files.forEach(f=>{
    const name=enc.encode(f.name),data=f.data,crc=crc32(data);
    const lh=new ArrayBuffer(30),v=new DataView(lh);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);
    v.setUint16(10,dTime,true);v.setUint16(12,dDate,true);v.setUint32(14,crc,true);
    v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);
    v.setUint16(26,name.length,true);v.setUint16(28,0,true);
    parts.push(new Uint8Array(lh),name,data);
    cen.push({name:name,crc:crc,size:data.length,off:off});
    off+=30+name.length+data.length;
  });
  const cdStart=off;let cdSize=0;
  cen.forEach(c=>{
    const ch=new ArrayBuffer(46),v=new DataView(ch);
    v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(8,0x0800,true);v.setUint16(10,0,true);
    v.setUint16(12,dTime,true);v.setUint16(14,dDate,true);v.setUint32(16,c.crc,true);
    v.setUint32(20,c.size,true);v.setUint32(24,c.size,true);v.setUint16(28,c.name.length,true);
    v.setUint16(30,0,true);v.setUint16(32,0,true);v.setUint16(34,0,true);v.setUint16(36,0,true);
    v.setUint32(38,0,true);v.setUint32(42,c.off,true);
    parts.push(new Uint8Array(ch),c.name);
    cdSize+=46+c.name.length;off+=46+c.name.length;
  });
  const eo=new ArrayBuffer(22),ev=new DataView(eo);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,cen.length,true);ev.setUint16(10,cen.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,cdStart,true);ev.setUint16(20,0,true);
  parts.push(new Uint8Array(eo));
  let total=0;parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total);let p=0;parts.forEach(q=>{out.set(q,p);p+=q.length;});
  return out;
}
function xlsxBuild(rows){
  const enc=new TextEncoder();
  const hdr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+'\n';
  const ct=hdr+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  const rels=hdr+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const wb=hdr+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="예약명단" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const wbR=hdr+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  const st=hdr+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0"/></cellXfs></styleSheet>';
  let body='';
  rows.forEach((r,ri)=>{
    body+='<row r="'+(ri+1)+'">';
    r.forEach((v,ci)=>{
      const ref=String.fromCharCode(65+ci)+(ri+1);
      const txt=xlEsc(v).replace(/\n/g,'&#10;');
      body+='<c r="'+ref+'" t="inlineStr"'+(ri===0?' s="1"':'')+'><is><t xml:space="preserve">'+txt+'</t></is></c>';
    });
    body+='</row>';
  });
  const ws=hdr+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="12" customWidth="1"/><col min="2" max="2" width="16" customWidth="1"/><col min="3" max="3" width="22" customWidth="1"/><col min="4" max="4" width="42" customWidth="1"/></cols><sheetData>'+body+'</sheetData></worksheet>';
  return zipStore([
    {name:'[Content_Types].xml',data:enc.encode(ct)},
    {name:'_rels/.rels',data:enc.encode(rels)},
    {name:'xl/workbook.xml',data:enc.encode(wb)},
    {name:'xl/_rels/workbook.xml.rels',data:enc.encode(wbR)},
    {name:'xl/styles.xml',data:enc.encode(st)},
    {name:'xl/worksheets/sheet1.xml',data:enc.encode(ws)}
  ]);
}
function exportExcel(){
  if(!items.length){toast('저장할 예약이 없습니다');return;}
  const sorted=[...items].sort((a,b)=>startOf(a).localeCompare(startOf(b)));
  const rows=[['이름','전화번호','방문예약날짜','문의내용']];
  sorted.forEach(it=>{
    const ns=it.notes||{before:'',after:'',contract:''};
    const memo=[['[방문전]',ns.before],['[방문후]',ns.after],['[계약]',ns.contract]].filter(x=>x[1]).map(x=>x[0]+' '+x[1]).join('\n');
    rows.push([it.name||'',it.phone||'',(it.date||'')+(it.time?' '+it.time:''),memo]);
  });
  const u8=xlsxBuild(rows);
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([u8],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download='예약명단_'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.xlsx';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('엑셀 파일을 저장했습니다 (총 '+(rows.length-1)+'건)');
}
