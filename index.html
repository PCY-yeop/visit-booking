<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방문예약 — 정리노트</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E6B4F">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EFE9; --card:#FFFFFF; --ink:#20241F; --sub:#6E756D; --line:#E3E0D5;
  --green:#0E6B4F; --deep:#0B4A37; --green-soft:#E4EFE7;
  --red:#C25543; --red-soft:#F7E9E4;
  --amber:#A8742C; --amber-soft:#F6EEDD;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;color:var(--ink);background:#E7E4DB;min-height:100dvh;display:flex;justify-content:center}
.num{font-variant-numeric:tabular-nums}
#frame{width:100%;max-width:430px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(30,40,30,.10)}
@media(min-width:920px){
  #frame{max-width:1080px;margin:20px auto;min-height:calc(100dvh - 40px);border-radius:26px;overflow:hidden}
}
@media(min-width:520px) and (max-width:919px){#frame{margin:20px auto;min-height:calc(100dvh - 40px);border-radius:26px;overflow:hidden}}
@media(min-width:920px){#frame{max-width:1080px}}

/* 헤더 */
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:16px 18px 10px;display:flex;align-items:center;gap:10px}
header .logo{width:34px;height:34px;border-radius:10px;background:var(--deep);display:grid;place-items:center;flex:none}
header h1{font-family:'Gowun Batang',serif;font-size:20px;font-weight:700;letter-spacing:-.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{font:inherit;font-size:12px;font-weight:700;color:var(--sub);background:none;border:1px solid var(--line);border-radius:99px;padding:6px 11px;cursor:pointer;white-space:nowrap}
header button.install{color:var(--green);border-color:var(--green)}
.upd{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(15,23,18,.45);padding:24px}
.upd.on{display:grid}
.upd-card{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:300px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.25);animation:updPop .25s ease}
@keyframes updPop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.upd-ic{width:54px;height:54px;margin:0 auto 12px;border-radius:16px;background:rgba(14,107,79,.09);display:grid;place-items:center;color:var(--green)}

/* 상태 지정 버튼 — 4개 동일 구조, 상태색만 구분 */
.st-btn{width:100%;font:inherit;font-size:14px;font-weight:800;padding:12px;border-radius:11px;border:1.5px solid;background:var(--card);cursor:pointer}
.st-btn:active{transform:scale(.98)}
.st-btn.p{border-color:var(--green);color:var(--green)}
.st-btn.d{border-color:var(--deep);color:var(--deep)}
.st-btn.c{border-color:var(--amber);color:var(--amber)}
.st-btn.x{border-color:var(--red);color:var(--red)}
/* 섹션 메뉴 버튼 (1행 50/50 · 2행 1/3) */
.menu-row{display:grid;gap:10px;margin-top:10px}
.menu-row.r1{grid-template-columns:1fr 1fr}
.menu-row.r2{grid-template-columns:1fr 1fr 1fr}
.menu-tile{font:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;box-shadow:0 1px 2px rgba(30,40,30,.05)}
.menu-tile .mt{font-family:'Gowun Batang',serif;font-size:14.5px;font-weight:700;color:var(--ink)}
.menu-tile.on{border-color:var(--deep);background:var(--deep)}
.menu-tile.on .mt{color:#fff}
.sec-line{font-size:11px;font-weight:800;color:var(--sub);margin:12px 2px 0}
.page{display:none;margin-top:5px}
.page>.r-item:first-child,.page>.sec-line:first-child,.page>.empty:first-child,.page>.cal:first-child{margin-top:0}
.page.on{display:block;padding:2px 2px 0}



main{flex:1;padding:0 12px 110px;overflow:visible}
h2.sec{font-family:'Gowun Batang',serif;font-size:15px;font-weight:700;color:var(--deep);margin:14px 4px 8px;display:flex;align-items:center;gap:8px}
h2.sec .cnt{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:11px;font-weight:800;background:var(--green-soft);color:var(--green);border-radius:99px;padding:3px 8px}

.filterchip{display:none;align-items:center;gap:6px;margin:8px 2px 0;font-size:12.5px;font-weight:700;color:#fff;background:var(--green);border:none;border-radius:99px;padding:6px 12px;cursor:pointer}
.filterchip.on{display:inline-flex}

/* 예약 행 */
.r-item{background:var(--card);border-radius:14px;margin-top:8px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 2px rgba(30,40,30,.05);cursor:pointer;border:1.5px solid transparent}
.r-item:active{border-color:var(--green)}
.r-item.done{opacity:.55}
.tchip{flex:none;width:auto;min-width:70px;max-width:94px;background:var(--deep);color:#fff;border-radius:9px;text-align:center;padding:7px 6px;line-height:1.25;overflow:hidden}
.tchip .d{font-size:10.5px;font-weight:600;opacity:.75;display:block}
.tchip .tt{font-size:10.5px;font-weight:800;display:block;word-break:break-word;letter-spacing:-.2px}
.r-info{flex:1;min-width:0}
.r-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.r-name .site{font-size:11px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.r-meta{font-size:12.5px;color:var(--sub);margin-top:2px}
.r-acts{display:flex;flex-direction:row;align-items:center;gap:7px}
.r-acts button{font:inherit;font-size:11px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:5px 9px;cursor:pointer}
.stbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--green);background:var(--card);color:var(--green);cursor:pointer;display:grid;place-items:center}
.stbtn:active{background:var(--green-soft)}
.stbtn.memoed{background:var(--green);color:#fff}
.stbtn.fweb{background:var(--deep);border-color:var(--deep);color:#fff}
#wsheet{position:fixed;inset:0;z-index:44;display:none}
#wsheet.on{display:block}
#wsheet .dim{position:absolute;inset:0;background:rgba(15,23,32,.45)}
#wsheet .panel{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 20px 30px;animation:up .25s cubic-bezier(.2,.8,.3,1);max-height:92dvh;overflow-y:auto;z-index:2}
@media(min-width:520px){#wsheet .panel{border-radius:22px;bottom:50%;transform:translate(-50%,50%)}}
.badge-cx{font-size:10px;font-weight:800;color:var(--red);background:var(--red-soft);border-radius:6px;padding:2px 6px}
.r-review{font-size:12px;color:var(--deep);margin-top:3px;line-height:1.5}
.r-review .lb{font-weight:800;color:var(--green)}
.r-review .cx{color:var(--red);font-weight:800}
.memo-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.memo-tabs button{font:inherit;font-size:12.5px;font-weight:800;padding:9px 0;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.memo-tabs button.on{background:var(--deep);border-color:var(--deep);color:#fff}
#msheet textarea{width:100%;font:inherit;font-size:13.5px;line-height:1.6;padding:12px 14px;border:1.5px dashed #C9C5B8;border-radius:12px;height:130px;min-height:130px;max-height:40vh;resize:vertical;background:var(--card);outline:none;font-family:inherit}
#msheet textarea:focus{border-color:var(--green);border-style:solid}
.past{filter:grayscale(.4)}

/* 캘린더 */
.cal{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(30,40,30,.05)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .mon{font-family:'Gowun Batang',serif;font-size:18px;font-weight:700}
.cal-head button{font:inherit;width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-grid .hd{font-size:10.5px;font-weight:800;color:var(--sub);text-align:center;padding:4px 0}
.cal-grid .hd.sun{color:var(--red)}
.cell{position:relative;min-height:46px;border-radius:9px;background:transparent;border:1.5px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:4px}
.cell:hover{background:var(--bg)}
.cell.out{opacity:.32}
.cell.today .dn{background:var(--deep);color:#fff}
.cell.sel{border-color:var(--green);background:var(--green-soft)}
.cell .dn{font-size:12.5px;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.cell .cn{font-size:9px;font-weight:800;color:var(--green);line-height:1;margin-top:1px}
.cell .tm{font-size:8.5px;font-weight:800;color:var(--green);line-height:1}
.daypanel{margin-top:10px;display:none}
.daypanel.on{display:block}
.daypanel .dp-h{font-size:13px;font-weight:800;margin:2px 2px 6px;color:var(--deep)}

/* 빈 상태 */
input::placeholder{color:rgba(120,120,120,.55);opacity:1}
input::-webkit-input-placeholder{color:rgba(120,120,120,.55);opacity:1}
.empty{text-align:center;color:var(--sub);font-size:13px;line-height:1.8;padding:36px 12px;border:1.5px dashed var(--line);border-radius:14px;margin-top:10px;background:rgba(255,255,255,.5)}
.empty b{color:var(--green)}

/* FAB */
.fab-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:15;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 24px)}
@media(min-width:920px){.fab-wrap{left:auto;right:34px;transform:none}}
.fab{background:var(--deep);color:#fff;border:none;border-radius:99px;padding:13px 20px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(11,74,55,.35);display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.fab:active{transform:scale(.97)}
.fab-icon{background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:14px;box-shadow:0 10px 24px rgba(30,40,30,.15)}
#frame:not(.in) .fab-wrap{display:none}

/* 시트 */
#sheet,#ssheet,#msheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.on,#ssheet.on,.on,#msheet.on{display:block}
#sheet .dim,#ssheet .dim, .dim,#msheet .dim{position:absolute;inset:0;background:rgba(30,40,30,.45)}
#sheet .panel,#ssheet .panel, .panel,#msheet .panel,#wsheet .panel{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 20px 30px;animation:up .25s cubic-bezier(.2,.8,.3,1);max-height:92dvh;overflow-y:auto}
@media(min-width:520px){#sheet .panel,#ssheet .panel, .panel,#msheet .panel,#wsheet .panel{border-radius:22px;bottom:50%;transform:translate(-50%,50%)}}
#fsheet{position:fixed;inset:0;z-index:30;display:none}
#fsheet.on{display:block}
#fsheet .dim{position:absolute;inset:0;background:rgba(30,40,30,.45)}
#fsheet .panel{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 20px 30px;animation:up .25s cubic-bezier(.2,.8,.3,1);max-height:92dvh;overflow-y:auto}
@media(min-width:520px){#fsheet .panel{border-radius:22px;bottom:50%;transform:translate(-50%,50%)}}
.pg{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);margin-top:8px}
.pg-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px}
.pg-head .pg-t{flex:1;min-width:0}
.icon-btn{font:inherit;font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;flex:none}
.wcard{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:8px;font-size:13px}

/* ── 양식 편집 팝업 (손님 화면 미리보기) ── */
#feditor{position:fixed;inset:0;z-index:45;display:none;background:var(--bg)}
#feditor.on{display:flex;flex-direction:column}
.fe-body{max-width:520px;width:100%;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
.fe-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;flex:none}
.fe-head b{font-size:15px}
.fe-stage{flex:1;min-height:0;background:#f7f5f0;border:1.5px solid var(--line);border-radius:14px;margin:0 18px;padding:22px 20px 18px;
  background-image:linear-gradient(rgba(18,58,92,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,58,92,.045) 1px,transparent 1px);
  background-size:24px 24px;overflow-y:auto}
.fe-eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:#b98a2f;margin-bottom:6px}
.fe-q{font-size:20px;font-weight:800;color:#123a5c;line-height:1.35;white-space:pre-wrap}
.fe-sub{font-size:12.5px;color:#4a6072;margin:4px 0 14px}
.fe-opts{display:flex;flex-direction:column;gap:8px}
.fe-opt{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #e3ddd2;border-radius:12px;padding:12px 14px}
.fe-mark{width:18px;height:18px;flex:none;border:2px solid #cfc7b8;border-radius:50%}
.fe-t{flex:1;min-width:0}.fe-t b{display:block;font-size:14.5px;color:#152736}
.fe-t span{display:block;font-size:11.5px;color:#4a6072;margin-top:1px}
.fe-mcal{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px;margin-bottom:10px}
.fe-mcal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.fe-mcal-head b{font-size:12.5px}
.fe-mcal-head button{font:inherit;font-size:13px;font-weight:800;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--sub);cursor:pointer;pointer-events:none}
.fe-mcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.fe-mcal-grid .w{font-size:9.5px;font-weight:800;color:var(--sub)}
.fe-mcal-grid .w.sun{color:#c0392b}
.fe-mcal-grid .d{font-size:11.5px;font-weight:700;padding:6px 0;border-radius:7px;color:var(--ink);background:var(--bg);pointer-events:none}
.fe-mcal-grid .d.sel{background:var(--deep);color:#fff}
.fe-mcal-grid .d.today{box-shadow:inset 0 0 0 1.5px var(--deep)}
.fe-dchip{background:#fff;border:1.5px solid #e3ddd2;border-radius:10px;padding:9px 4px;text-align:center}
.fe-dchip .d1{font-size:13px;font-weight:800;color:#152736}.fe-dchip .d2{font-size:10.5px;color:#4a6072}
.fe-chips{display:flex;flex-wrap:wrap;gap:6px}
.fe-chip{border:1.5px solid #e3ddd2;background:#fff;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:600;color:#4a6072}
.fe-chip small{opacity:.7;font-size:10px}
.fe-inputs{display:flex;flex-direction:column;gap:8px}
.fe-flabel{font-size:12px;font-weight:700;color:#4a6072}
.fe-fake{display:block;background:#fff;border:1.5px solid #e3ddd2;border-radius:10px;padding:11px 12px;font-size:14px;color:#6b7a86}
.fe-btnrow{display:flex;gap:8px;margin-top:16px}
.fe-backdemo{flex:none;padding:12px 18px;border:1.5px solid #e3ddd2;border-radius:10px;font-size:13.5px;font-weight:800;color:#4a6072;background:#f7f5f0}
.fe-nextdemo{flex:1;text-align:center;padding:12px;background:#b98a2f;color:#fff;border-radius:10px;font-size:14px;font-weight:800}
.fe-edit{flex:1;overflow-y:auto;padding:12px 18px}
.fe-editbox{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
.fe-editbox label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:4px}
.fe-editbox textarea,.fe-editbox input[type=text]{width:100%;box-sizing:border-box;min-width:0;font:inherit;font-size:14px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.fe-editbox textarea{resize:vertical;min-height:48px}
.fe-orow{display:flex;gap:6px;margin-top:6px;align-items:center}
.fe-orow input{flex:1;min-width:0;box-sizing:border-box;font:inherit;font-size:13.5px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.fe-onum{flex:none;width:20px;text-align:center;font-size:11.5px;font-weight:800;color:var(--sub)}
.fe-ocount{display:flex;gap:8px;align-items:center;margin-top:8px}
.fe-ocount span{font-size:12.5px;font-weight:800;color:var(--sub);flex:1}
.fe-ocount button{font:inherit;font-size:14px;font-weight:800;width:34px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.fe-ocount button:active{transform:scale(.94)}
.fe-bottom{flex:none;border-top:2px solid var(--line);background:var(--card);padding:8px 14px calc(10px + env(safe-area-inset-bottom))}
.fe-row1{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.fe-row1 button{flex:1;font:inherit;font-size:14px;font-weight:800;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.fe-row1 button:disabled{opacity:.35;cursor:default}
.fe-row1 span{font-size:12.5px;font-weight:800;color:var(--sub);flex:none;min-width:48px;text-align:center}
.fe-row2{display:flex;gap:6px}
.fe-row2 button{flex:1;font:inherit;font-size:13px;font-weight:800;padding:11px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.fe-row2 .fe-save{background:var(--deep);border-color:var(--deep);color:#fff}
.fe-row2 button:disabled{opacity:.35;cursor:default}

.fe-edit-txt{outline:none;border-radius:6px;transition:box-shadow .12s;cursor:text;min-width:24px;display:inline-block}
.fe-edit-txt:focus{box-shadow:0 0 0 2px rgba(185,138,47,.45);background:#fff}
.fe-q.fe-edit-txt{display:block}
.fe-sub.fe-edit-txt{display:block}
.fe-t .fe-edit-txt{display:block}
.fe-edit-txt.fe-empty{opacity:.45}
.fe-x{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:14px;font-weight:800;cursor:pointer;line-height:1}
.fe-x:active{transform:scale(.9)}
.fe-auto{display:flex;gap:6px;align-items:center;margin-top:10px;font-weight:700;font-size:12.5px;color:var(--sub)}
.fe-auto input{width:auto}
@media(min-width:920px){#sheet .panel{max-width:560px}}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sl-head h3{font-family:'Gowun Batang',serif;font-size:17px}
.sl-head button{font:inherit;font-size:12px;font-weight:700;color:var(--sub);background:none;border:none;cursor:pointer}
.sl-note{font-size:12.5px;color:var(--sub);line-height:1.6;margin-bottom:10px}
.sl-note b{color:var(--green)}
textarea#raw{width:100%;font:inherit;font-size:13.5px;line-height:1.6;padding:12px 14px;border:1.5px dashed #C9C5B8;border-radius:12px;min-height:110px;resize:vertical;background:var(--card);outline:none;font-family:inherit}
textarea#raw:focus{border-color:var(--green);border-style:solid}
.sl-actions{display:flex;gap:8px;margin:10px 0 4px}
.sl-actions .btn{flex:1}
.btn{font:inherit;font-size:14px;font-weight:800;padding:12px;border-radius:11px;border:none;cursor:pointer}
.btn-primary{background:var(--deep);color:#fff}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--sub)}
.frm{display:none;flex-direction:column;gap:10px;margin-top:12px}
.frm.on{display:flex}

.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f input{width:100%}
.f input[type=date]{-webkit-min-logical-width:100%;min-width:100%}
.f label{font-size:11.5px;font-weight:800;color:var(--sub)}
.f input{font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);outline:none}
.f input:focus{border-color:var(--green)}
.parsed-ok{display:none;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--green);margin-top:8px}
.parsed-ok.on{display:flex}

/* 설치 안내 (아이폰 등 브라우저 설치 미지원 시 안내용) */
#install-ios{display:none;font-size:12.5px;color:var(--deep);line-height:1.7}

/* 로그인 화면 */
#view-login{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:32px 28px;gap:12px}
#view-login.hide{display:none}
.lg-mark{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
.lg-mark .book{width:64px;height:64px;border-radius:18px;background:var(--deep);display:grid;place-items:center;box-shadow:0 10px 22px rgba(11,74,55,.30)}
.lg-mark h1{font-family:'Gowun Batang',serif;font-size:24px;font-weight:700}
.lg-mark p{font-size:13px;color:var(--sub)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f input{width:100%}
.f input[type=date]{-webkit-min-logical-width:100%;min-width:100%}
.f label{font-size:11.5px;font-weight:800;color:var(--sub)}
.f input{font:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);outline:none}
.f input:focus{border-color:var(--green)}
.btn{font:inherit;font-size:15px;font-weight:800;padding:13px;border-radius:11px;border:none;cursor:pointer}
.btn-primary{background:var(--deep);color:#fff}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--sub)}
.btn:disabled{opacity:.5;cursor:wait}
.btn-danger{background:var(--red-soft);color:var(--red)}
.lg-err{font-size:13px;color:var(--red);text-align:center;min-height:18px}
.lg-note{font-size:12px;color:var(--sub);text-align:center;line-height:1.7}

#toast{position:fixed;bottom:92px;left:50%;transform:translate(-50%,14px);background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;z-index:50;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px}
</style>
</head>

<script>
/* ────────── 데이터 (계정별 저장) ────────── */
let uid='';
const itemsKey=()=>'rsms.items.'+uid;
let items=[];
function loadItems(){
  /* 기존 로컬 기록(rsms.v1.items)이 있으면 로그인한 계정으로 이관 */
  if(uid&&localStorage.getItem(itemsKey())===null){
    const old=localStorage.getItem('rsms.v1.items');
    if(old){localStorage.setItem(itemsKey(),old);localStorage.removeItem('rsms.v1.items');}
  }
  items=JSON.parse(localStorage.getItem(itemsKey())||'[]');
  items.forEach(it=>{if(!it.status)it.status=it.done?'done':'pending';});
  items.forEach(it=>{if(!it.notes)it.notes={before:it.memo||'',after:it.review||'',contract:''};  /* 기존 기록 상태 자동 지정 */
    if(!it.web&&it.notes.before&&String(it.notes.before).includes('웹접수')){it.web=it.notes.before;it.notes.before=wcomp(it.notes.before);}});
}
function wcomp(s){
  s=String(s||'');
  if(!s.includes('웹접수'))return s;
  return s.split('|').slice(1).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^[^:]*:\s*/,'')).join(', ');
}
const save=()=>{if(uid)localStorage.setItem(itemsKey(),JSON.stringify(items));cloudPush();};
let editingId=null, selDate=null, calY, calM;
const $=id=>document.getElementById(id);
const todayKey=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400);}

/* ────────── 문자 파서 ────────── */
function normalizeDate(s){
  if(!s)return '';
  let m=s.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if(!m)m=s.match(/(\d{2,4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(!m)return '';
  let[,y,mo,d]=m;y=String(y).length===2?'20'+y:y;
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function normalizePhone(s){
  const n=(s||'').replace(/[^\d]/g,'');
  if(n.length===11)return n.slice(0,3)+'-'+n.slice(3,7)+'-'+n.slice(7);
  if(n.length===10)return n.slice(0,3)+'-'+n.slice(3,6)+'-'+n.slice(6);
  return s||'';
}
function normalizeTime(s){
  if(!s)return '';
  const m=s.match(/(오전|오후|am|pm)?\s*(\d{1,2})\s*시\s*(\d{1,2})?\s*분?/i);
  if(m){let h=+m[2];const ap=(m[1]||'').toLowerCase();if(ap==='오후'||ap==='pm'){if(h<12)h+=12;}else if(ap==='오전'||ap==='am'){if(h===12)h=0;}return h+':'+String(m[3]?+m[3]:0).padStart(2,'0');}
  const m2=s.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if(m2)return m2[1].padStart(2,'0')+':'+m2[2];
  return '';
}
function guessName(t){
  const m=t.match(/예약(?:자|인|자명)?\s*[:：]?\s*([가-힣]{2,4})(?=\s|$|,|님)/);
  if(m)return m[1];
  for(const x of t.matchAll(/([가-힣]{2,4})\s*님/g)){if(!/고객|손님|회원/.test(x[1]))return x[1];}
  return '';
}
function parseSms(text){
  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const rest=lines[0]&&/발신/.test(lines[0])?lines.slice(1):lines;
  const val=re=>{const l=rest.find(x=>re.test(x));return l?l.replace(re,'').replace(/^[\s:：]+/,'').trim():'';};
  let date=normalizeDate(val(/^날짜/)||'');
  if(!date){const m=text.match(/\d{4}[.\-\/년]\s?\d{1,2}[.\-\/월]\s?\d{1,2}/);if(m)date=normalizeDate(m[0]);}
  if(!date){const m=text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);if(m&&+m[1]<=12&&+m[2]<=31){const now=new Date();let c=new Date(now.getFullYear(),+m[1]-1,+m[2]);if(c<new Date(now.getFullYear(),now.getMonth(),now.getDate()))c=new Date(now.getFullYear()+1,+m[1]-1,+m[2]);date=c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0');}}
  if(!date){const dm=text.match(/오늘|내일|모레/);if(dm){const off={오늘:0,내일:1,모레:2}[dm[0]];const t2=new Date();t2.setDate(t2.getDate()+off);date=t2.getFullYear()+'-'+String(t2.getMonth()+1).padStart(2,'0')+'-'+String(t2.getDate()).padStart(2,'0');}}
  let time=val(/^시간/);
  if(!time)time=normalizeTime((text.match(/(?:오전|오후|am|pm)?\s*\d{1,2}\s*시(?:\s*\d{1,2})?\s*분?|\d{1,2}\s*:\s*\d{2}/i)||[''])[0]);
  const name=val(/^이름/)||guessName(text);
  const phoneRaw=val(/^연락처|^전화/);
  const phone=normalizePhone(phoneRaw||((text.match(/0\d{1,2}[-\s]?\d{3,4}[-\s]?\d{4}/)||[''])[0]));
  let site='';
  const siteLine=rest.find(x=>!/^날짜|^시간|^이름|^연락처|^전화|^현장/.test(x)&&!/^[^\s:：]*명\s*[:：]/.test(x)&&!/\d{4}/.test(x));
  const sl=val(/^현장명?\s*[:：]?/);
  site=(sl||(siteLine||'')).replace(/^\[|\]$/g,'').trim();
  return {site,date,time,name,phone};
}

/* ────────── 시트 ────────── */
function sheetAnyOpen(){return $('sheet').classList.contains('on')||$('ssheet').classList.contains('on')||$('msheet').classList.contains('on')||$('fsheet').classList.contains('on')||$('wsheet').classList.contains('on');}
function _oldSheetAnyOpen(){return !!document.querySelector('#sheet.on,#msheet.on,#ssheet.on,#fsheet.on');}
function histPush(){if(!history.state||!history.state.rs){try{history.pushState({rs:1},'');}catch(_){}}}
function histPop(){if(history.state&&history.state.rs){try{history.back();}catch(_){}}}
addEventListener('popstate',()=>{if($('feditor').classList.contains('on')){$('feditor').classList.remove('on');delete editPages[feCode];feCode=null;renderForms();return;}if(sheetAnyOpen()){$('sheet').classList.remove('on');$('ssheet').classList.remove('on');$('msheet').classList.remove('on');$('fsheet').classList.remove('on');$('wsheet').classList.remove('on');}});
function openSheet(){
  editingId=null;
  $('sl-title').textContent='문자 붙여넣기';
  $('sl-note').style.display='block';
  $('raw').style.display='block';
  document.querySelector('#sheet .sl-actions').style.display='flex';
  $('p-ok').classList.remove('on');
  $('frm').classList.remove('on');
  $('del-btn').style.display='none';
  ['f-site','f-date','f-time','f-name','f-phone'].forEach(i=>$(i).value='');
  $('raw').value='';
  histPush();$('sheet').classList.add('on');
}
function closeSheet(){$('sheet').classList.remove('on');histPop();}
function analyze(){
  const text=$('raw').value.trim();
  if(!text)return toast('문자를 붙여넣어 주세요');
  const p=parseSms(text);
  $('f-site').value=p.site;$('f-date').value=p.date;$('f-time').value=p.time;
  $('f-name').value=p.name;$('f-phone').value=p.phone;
  $('p-ok').classList.add('on');$('frm').classList.add('on');
  if(!p.date)$('f-date').focus();
}
function openDirect(){
  $('p-ok').classList.remove('on');
  $('frm').classList.add('on');
  $('f-site').focus();
}
function saveItem(){
  const rec={site:$('f-site').value.trim(),date:$('f-date').value,time:$('f-time').value.trim(),name:$('f-name').value.trim(),phone:$('f-phone').value.trim(),memo:''};
  if(!rec.phone)return toast('연락처는 필수입니다');
  if(rec.date&&!/\d{4}-\d{2}-\d{2}/.test(rec.date))rec.date='';
  if(editingId){
    const it=items.find(x=>x.id===editingId);
    if(!it.web&&it.notes&&it.notes.before&&String(it.notes.before).includes('웹접수'))it.web=it.notes.before;
    const keep={notes:it.notes,web:it.web};
    Object.assign(it,rec,keep);  /* 이름·연락처·일정만 수정 — 웹접수·메모는 그대로 */
    toast('수정했습니다');
  }else{
    items.push({id:Date.now(),...rec,status:'pending',notes:{before:'',after:'',contract:''},createdAt:new Date().toISOString()});
    toast('예약이 기록되었습니다');
  }
  save();closeSheet();render();
}
function editItem(id){
  const it=items.find(x=>x.id===id);if(!it)return;
  editingId=id;
  $('sl-title').textContent='예약 수정';
  $('sl-note').style.display='none';
  $('raw').style.display='none';
  document.querySelector('#sheet .sl-actions').style.display='none';
  $('p-ok').classList.remove('on');
  $('f-site').value=it.site;$('f-date').value=it.date;$('f-time').value=it.time;$('f-name').value=it.name;$('f-phone').value=it.phone;
  $('frm').classList.add('on');$('del-btn').style.display='block';
  histPush();$('sheet').classList.add('on');
}
function delItem(){
  if(!editingId)return;
  const delId=editingId;
  items=items.filter(x=>x.id!==delId);
  save();cloudDel(delId);closeSheet();render();toast('삭제했습니다');
}
/* ────────── 상태 지정 & 방문 후기 ────────── */
let statusId=null,memoId=null,memoTab='before';
function hasNotes(it){return !!(it.notes&&(it.notes.before||it.notes.after||it.notes.contract));}
function openMemo(id,ev){
  ev&&ev.stopPropagation();
  const it=items.find(x=>x.id===id);if(!it)return;
  memoId=id;memoTab='before';
  $('ms-sub').innerHTML=`<b>${it.name}</b> · ${fmtK(it.date)}${it.time?' '+it.time:''}`;
  const _ws=it.web||(it.notes&&it.notes.before&&String(it.notes.before).includes('웹접수')?it.notes.before:'');
  const mw=$('ms-web');
  if(_ws){mw.style.display='';mw.textContent='양식답변 · '+wcomp(_ws);}else mw.style.display='none';
  switchMemoTab('before',it);
  histPush();$('msheet').classList.add('on');
}
function switchMemoTab(t,keep){
  const cur=items.find(x=>x.id===memoId);
  if(cur&&!cur.notes)cur.notes={before:'',after:'',contract:''};
  if(cur&&!keep)cur.notes[memoTab]=$('m-text').value.trim();  /* 전환 전 임시저장 */
  memoTab=t;
  document.querySelectorAll('#memo-tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  $('m-text').value=(cur&&cur.notes&&cur.notes[t])||'';
}
function saveMemo(){
  const it=items.find(x=>x.id===memoId);if(!it)return;
  if(!it.notes)it.notes={before:'',after:'',contract:''};
  it.notes[memoTab]=$('m-text').value.trim();
  save();closeS();render();toast('메모를 저장했습니다');
}
function webAlert(fresh){
  try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(_){}
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)();
    [880,1175].forEach(function(f,i){const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.25,c.currentTime+i*.28);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.28+.25);o.start(c.currentTime+i*.28);o.stop(c.currentTime+i*.28+.26);});
  }catch(_){}
  const names=fresh.map(x=>(x.name||'손님')+(x.date?' · '+fmtK(x.date):'')).join(', ');
  toast('🔔 새 웹 접수 '+fresh.length+'건 — '+names);
  if(window.Notification&&Notification.permission==='granted'){
    try{new Notification('새 웹 접수 '+fresh.length+'건',{body:names});}catch(_){}
  }
  render();
}
function askNotify(){if(window.Notification&&Notification.permission==='default')try{Notification.requestPermission();}catch(_){}}
function closeS(){$('ssheet').classList.remove('on');$('msheet').classList.remove('on');$('wsheet').classList.remove('on');histPop();}
function delWebAnswer(){
  if(wsId==null)return;
  if(!confirm('이 예약에 저장된 양식 답변을 삭제할까요?\n예약 자체는 유지됩니다.'))return;
  const it=items.find(x=>x.id===wsId);
  if(!it)return closeS();
  delete it.web;
  if(it.notes&&it.notes.before&&String(it.notes.before).includes('웹접수'))it.notes.before='';
  save();render();closeS();toast('양식 답변을 삭제했습니다');
}
let wsId=null,wsClaimed=false;
function viewWeb(id,claimed){
  let it=webItems.find(x=>x.id===id);
  if(!it&&claimed)it=items.find(x=>x.id===id);
  if(!it)return;
  wsId=id;wsClaimed=!!claimed;

const cRev=r=>({id:Number(r.id),site:r.site||'',name:r.name||'',phone:r.phone||'',date:r.date||'',time:r.time||'',status:r.status||'pending',notes:r.notes||{before:'',after:'',contract:''},web:r.notes&&r.notes.before&&String(r.notes.before).includes('웹접수')?'':(r.web||''),createdAt:r.created_at,updatedAt:r.updated_at});
function cloudPush(){
  if(!sb||!cloudOn||!uid||!items.length)return;
  for(let i=0;i<items.length;i+=500){
    sb.from('reservations').upsert(items.slice(i,i+500).map(cRow)).then(r=>{if(r.error)cloudOn=false;}).catch(()=>{cloudOn=false;});
  }
}
function cloudDel(id){
  if(!sb||!cloudOn)return;
  sb.from('reservations').delete().eq('id',id).then(()=>{},()=>{});
}
let webItems=[];
const esc2=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function cloudSync(){
  if(!sb||!uid)return;
  try{
    let all=[],from=0;
    for(;;){
      const{data,error}=await sb.from('reservations').select('*').range(from,from+999);
      if(error)return;
      all=all.concat(data||[]);
      if(!data||data.length<1000)break;
      from+=1000;
      if(from>=100000)break;  /* 안전 한도 */
    }
    webItems=all.filter(r=>!r.user_id).map(cRev);
    const _known=window.__knownWeb||(window.__knownWeb=new Set());
    const _fresh=webItems.filter(x=>!_known.has(x.id));
    if(_known.size||window.__webInitDone){ if(_fresh.length)webAlert(_fresh); }
    else window.__webInitDone=true;
    webItems.forEach(x=>_known.add(x.id));
    all=all.filter(r=>r.user_id);
    cloudOn=true;
    const map=new Map(all.map(r=>[Number(r.id),cRev(r)]));
    const up=[];
    items.forEach(l=>{
      const c=map.get(l.id);
      if(!c){up.push(cRow(l));return;}
      const lt=l.updatedAt||l.createdAt||'',ct=c.updatedAt||c.createdAt||'';
      if(lt>ct)up.push(cRow(l));else map.set(l.id,c);
    });
    if(up.length){const r=await sb.from('reservations').upsert(up);if(r.error)return;}
    items=[...map.values()];
    if(uid)localStorage.setItem(itemsKey(),JSON.stringify(items));
    render();
  }catch(_){}
}
/* ────────── 웹 접수 문의 수령 ────────── */
async function claimWeb(id){
  if(!sb)return toast('클라우드에 연결되지 않았습니다');
  const it=webItems.find(x=>x.id===id);if(!it)return;
  const g=await sb.auth.getUser();
  if(!g.data||!g.data.user)return toast('다시 로그인해 주세요');
  const r=await sb.from('reservations').update({user_id:g.data.user.id,updated_at:new Date().toISOString()}).eq('id',id);
  if(r.error)return toast('받기 실패 — 잠시 후 다시 시도해 주세요');
  if(window.__knownWeb)window.__knownWeb.delete(id);
  webItems=webItems.filter(x=>x.id!==id);
  if(!it.createdAt)it.createdAt=new Date().toISOString();
  if(!it.updatedAt)it.updatedAt=new Date().toISOString();
  if(!it.web)it.web=(it.notes&&it.notes.before)||'';  /* 양식 답변은 web에 별도 보관 — 메모와 분리 */
  it.notes={before:'',after:'',contract:''};  /* 메모는 비워둠 — 자유롭게 추가 작성 */
  items.push(it);save();render();toast('예약으로 받았습니다');
}
function delWeb(id){
  if(!sb)return;
  sb.from('reservations').delete().eq('id',id).then(()=>{
    if(window.__knownWeb)window.__knownWeb.delete(id);
  webItems=webItems.filter(x=>x.id!==id);render();toast('삭제했습니다');
  },()=>toast('삭제 실패'));
}

/* ────────── 폼 관리 (현장별 고객 문의 양식) ────────── */
let forms=[];
const esc3=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const formCode=()=>Math.random().toString(36).slice(2,8);
function formLink(c){return location.origin+location.pathname.replace(/[^/]*$/,'')+'form.html?s='+c;}
async function loadForms(){
  if(!sb||!uid){$('forms-list').innerHTML='<div class="empty">로그인이 필요합니다.</div>';return;}
  try{
    const{data,error}=await sb.from('forms').select('*').order('created_at',{ascending:true});
    forms=error?[]:(data||[]);
  }catch(_){forms=[];}
  renderForms();
}
const IS='font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);box-sizing:border-box;width:100%;min-width:0';
const PG_TYPE={select:'선택지 페이지',date:'방문일 페이지',contact:'연락처 페이지',memo:'메모 페이지'};
const DEF_PAGES=f=>[
  {id:'purpose',type:'select',q:'어떤 목적으로 문의하셨나요?',sub:'하나만 선택해 주세요.',opts:['실거주|직접 입주 목적','투자|수익 · 자산 목적'],auto:true},
  {id:'type',type:'select',q:'희망하시는 타입을 알려주세요',sub:(f&&f.intro)||'모델하우스에서 보실 평형이에요.',opts:(f&&f.types&&f.types.length)?f.types.slice():['59㎡(A)','59㎡(B)','84㎡(A)','84㎡(B)','상관없음'],auto:true},
  {id:'date',type:'date',q:'언제 방문하실 예정인가요?',sub:'날짜를 선택하고 시간대를 골라 주세요.',opts:['10시','11시','12시','13시','14시','15시','16시','17시','18시','미정|시간은 나중에 확정']},
  {id:'party',type:'select',q:'몇 분이서 방문하시나요?',sub:'정확히 몇 명인지 몰라도 괜찮아요.',opts:['1명|혼자 방문','2명|커플 · 부부 · 지인과','3명 이상|가족 · 단체'],auto:true},
  {id:'contact',type:'contact',q:'이름을 알려주세요',sub:'선택하신 일시로 담당자가 다시 연락드릴게요.'},
  {id:'memo',type:'memo',q:'궁금하신 점이 있나요?',sub:'없으면 그냥 넘어가도 돼요. (선택)'}
];
let editPages={};
function pagesOf(f){
  if(!editPages[f.code])editPages[f.code]=(f.pages&&f.pages.length)?JSON.parse(JSON.stringify(f.pages)):DEF_PAGES(f);
  return editPages[f.code];
}
function pgUp(c,i){const a=editPages[c];if(i<=0)return;[a[i-1],a[i]]=[a[i],a[i-1]];renderForms();}
function pgDown(c,i){const a=editPages[c];if(i>=a.length-1)return;[a[i+1],a[i]]=[a[i],a[i+1]];renderForms();}
function pgDel(c,i){const a=editPages[c];const p=a[i];if(p.type==='contact')return toast('연락처 페이지는 삭제할 수 없습니다');if(p.type==='date')return toast('방문일 페이지는 삭제할 수 없습니다');a.splice(i,1);renderForms();}
function pgAdd(c){editPages[c].push({id:'c'+Math.random().toString(36).slice(2,6),type:'select',q:'',sub:'',opts:[],auto:true});renderForms();}

/* ────────── 양식 편집 팝업 (손님 화면과 동일한 미리보기) ────────── */
let feCode=null, feIdx=0;
const FE_EYEBROW={select:'SELECT',date:'VISIT DATE',contact:'CONTACT',memo:'MEMO'};
function openFormEditor(code){
  const f=forms.find(x=>x.code===code);if(!f)return;
  feCode=code;feIdx=0;
  delete editPages[code];  /* 항상 저장된 양식에서 새 스냅샷 시작 */
  pagesOf(f);
  $('fe-title').textContent=(f.site||'양식')+' 편집';
  try{history.pushState({fe:1},'');}catch(_){}
  $('feditor').classList.add('on');
  feRender();
}
function closeFormEditor(){
  if($('feditor').classList.contains('on')){
    $('feditor').classList.remove('on');
    delete editPages[feCode];  /* 저장 안 했으면 편집 내용 버림 — 저장된 양식 유지 */
    feCode=null;
    try{if(history.state&&history.state.fe)history.back();}catch(_){/* */}
    renderForms();
  }
}
function fePages(){return editPages[feCode]||[];}
function feSave(){
  const f=forms.find(x=>x.code===feCode);if(!f)return;
  const pgs=fePages();
  if(!pgs.some(p=>p.type==='contact'))return toast('연락처 페이지는 필수입니다');
  if(!pgs.some(p=>p.type==='date'))return toast('방문일 페이지는 필수입니다');
  const tpg=pgs.find(p=>p.id==='type');
  const patch={
    pages:pgs,
    types:tpg?tpg.opts.map(o=>String(o).split('|')[0]):(f.types||[]),
    intro:tpg?tpg.sub:'',
    updated_at:new Date().toISOString()
  };
  sb.from('forms').update(patch).eq('code',feCode).then(r=>{
    if(r.error)return toast('저장 실패 — SQL의 pages 컬럼 실행 여부를 확인해 주세요');
    Object.assign(f,patch);
    toast('저장했습니다 — 링크에 즉시 반영됩니다');
    closeFormEditor();
  });
}
function fePrev(){if(feIdx>0){feIdx--;feRender();}}
function feNext(){if(feIdx<fePages().length-1){feIdx++;feRender();}}
function feAdd(){
  const pgs=fePages();
  const nxt=pgs[feIdx+1];
  if(nxt&&nxt.type==='contact')return toast('연락처 페이지 앞에는 페이지를 추가할 수 없습니다');
  pgs.splice(feIdx+1,0,{id:'c'+Math.random().toString(36).slice(2,6),type:'select',q:'새 질문을 입력하세요',sub:'',opts:['선택지 1','선택지 2'],auto:true});
  feIdx++;feRender();
}
function feDel(){
  const pgs=fePages();
  if(pgs.length<=2)return toast('최소 2페이지는 유지해야 합니다');
  const p=pgs[feIdx];
  if(p.type==='contact')return toast('연락처 페이지는 삭제할 수 없습니다');
  if(p.type==='date')return toast('방문일 페이지는 삭제할 수 없습니다');
  pgs.splice(feIdx,1);
  if(feIdx>=pgs.length)feIdx=pgs.length-1;
  feRender();
}
function feRender(){
  const pgs=fePages();
  if(feIdx>=pgs.length)feIdx=pgs.length-1;
  const p=pgs[feIdx];
  $('fe-pos').textContent=(feIdx+1)+' / '+pgs.length;
  /* 통합 화면: 손님이 보는 그 화면 그대로, 텍스트를 직접 클릭해 수정 */
  let pv='<div class="fe-eyebrow">'+(FE_EYEBROW[p.type]||'INFO')+'</div>'
    +'<div class="fe-q fe-edit-txt'+(p.q?'':' fe-empty')+'" contenteditable="true" data-k="q" spellcheck="false">'+esc3(p.q||'눌러서 질문 입력')+'</div>'
    +'<div class="fe-sub fe-edit-txt'+(p.sub?'':' fe-empty')+'" contenteditable="true" data-k="sub" spellcheck="false">'+esc3(p.sub||'눌러서 안내 문구 입력')+'</div>';
  if(p.type==='select'){
    pv+='<div class="fe-opts">';
    (p.opts||[]).forEach((o,i)=>{
      const pr=String(o).split('|');
      pv+='<div class="fe-opt"><span class="fe-mark"></span><span class="fe-t">'
        +'<b class="fe-edit-txt'+(pr[0]?'':' fe-empty')+'" contenteditable="true" data-oi="'+i+'" data-op="0" spellcheck="false">'+esc3(pr[0]||'선택지')+'</b>'
        +'<span class="fe-edit-txt'+(pr[1]?'':' fe-empty')+'" contenteditable="true" data-oi="'+i+'" data-op="1" spellcheck="false">'+esc3(pr[1]||'설명 (선택)')+'</span>'
        +'</span><button class="fe-x" onclick="feOptDelAt('+i+')" title="이 선택지 삭제">×</button></div>';
    });
    pv+='</div>';
  }else if(p.type==='date'){
    const now=new Date(),y=now.getFullYear(),m=now.getMonth();
    const first=new Date(y,m,1).getDay();
    const dim=new Date(y,m+1,0).getDate();
    const tk=y+'-'+String(m+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    let mon='';['일','월','화','수','목','금','토'].forEach((w,i)=>{mon+='<span class="w'+(i===0?' sun':'')+'">'+w+'</span>';});
    let cells='';for(let i=0;i<first;i++)cells+='<span class="d out">·</span>';
    for(let d=1;d<=dim;d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');cells+='<span class="d'+(k===tk?' today':'')+'">'+d+'</span>';}
    pv+='<div class="fe-mcal"><div class="mcal-head" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px"><button type="button">‹</button><b style="font-size:12.5px">'+y+'년 '+(m+1)+'월</b><button type="button">›</button></div><div class="fe-mcal-grid">'+mon+cells+'</div></div><div class="fe-chips">';
    (p.opts&&p.opts.length?p.opts:['오전','오후','저녁','시간무관']).forEach((o,i)=>{
      const pr=String(o).split('|');
      pv+='<span class="fe-chip"><span class="fe-edit-txt'+(pr[0]?'':' fe-empty')+'" contenteditable="true" data-oi="'+i+'" data-op="0" spellcheck="false">'+esc3(pr[0]||'시간대')+'</span>'
        +(pr[1]?'<small class="fe-edit-txt" contenteditable="true" data-oi="'+i+'" data-op="1" spellcheck="false">'+esc3(pr[1])+'</small>':'')
        +'</span>';
    });
    pv+='</div>';
  }else if(p.type==='contact'){
    pv+='<div class="fe-inputs"><span class="fe-flabel">이름</span><span class="fe-fake">홍길동</span><span class="fe-flabel">연락처</span><span class="fe-fake">010-1234-5678</span></div>';
  }else if(p.type==='memo'){
    pv+='<div class="fe-fake" style="min-height:80px;text-align:left">예) 분양가 안내, 주차 대수 등</div>';
  }
  pv+='<div class="fe-autobar">'+(p.type==='select'?'<label class="fe-auto"><input type="checkbox" '+(p.auto?'checked':'')+' onchange="feSetAuto(this.checked)"> 선택하면 자동으로 다음 페이지</label>':'')+'</div>';
  pv+='<div class="fe-btnrow"><span class="fe-backdemo">← 이전</span><span class="fe-nextdemo">'+(feIdx===pgs.length-1?'작성 완료 ✓':'다음')+'</span></div>';
  $('fe-stage').innerHTML=pv;
  bindFeEdit();
  $('fe-prev').disabled=feIdx===0;
  $('fe-next').disabled=feIdx===pgs.length-1;
  const locked=(p.type==='contact'||p.type==='date');
  $('fe-del').disabled=locked;
  const oa=$('fe-optadd');if(oa){oa.style.display=(p.type==='select'||p.type==='date')?'':'none';oa.disabled=locked;}
  const pa=$('fe-add');if(pa)pa.disabled=false;
}
/* 미리보기 안의 텍스트를 직접 수정 → 데이터에 즉시 반영 */
function bindFeEdit(){
  const p=fePages()[feIdx];
  $('fe-stage').querySelectorAll('[contenteditable]').forEach(el=>{
    el.addEventListener('input',()=>{
      const k=el.dataset.k, oi=el.dataset.oi, op=el.dataset.op;
      if(k!==undefined){p[k]=el.textContent;}
      else if(oi!==undefined){
        const i=+oi, part=+op;
        if(!p.opts)p.opts=[];
        const pr=String(p.opts[i]||'').split('|');
        pr[part]=el.textContent.trim();
        p.opts[i]=(pr[0]||'')+(pr[1]?'|'+pr[1]:'');
      }
    });
    el.addEventListener('focus',()=>{if(el.classList.contains('fe-empty')){el.classList.remove('fe-empty');if(el.textContent.indexOf('눌러서')===0||el.textContent==='선택지'||el.textContent==='설명 (선택)'||el.textContent==='시간대')el.textContent='';}});
    el.addEventListener('blur',()=>{if(!el.textContent.trim()){el.classList.add('fe-empty');el.textContent=el.dataset.k==='q'?'눌러서 질문 입력':el.dataset.k==='sub'?'눌러서 안내 문구 입력':el.dataset.op==='0'?(p.type==='date'?'시간대':'선택지'):'설명 (선택)';}});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}});
  });
}
function feSetAuto(v){fePages()[feIdx].auto=v;}
function feOptDelAt(i){
  const p=fePages()[feIdx];
  if(!p.opts||p.opts.length<=1)return toast('최소 1개는 유지해야 합니다');
  p.opts.splice(i,1);feRender();
}
function feOptAdd(){
  const p=fePages()[feIdx];
  if(!p.opts)p.opts=[];
  if(p.opts.length>=12)return toast('최대 12개까지입니다');
  p.opts.push(p.type==='date'?'시간대 '+(p.opts.length+1):'선택지 '+(p.opts.length+1));
  feRender();
  const eds=$('fe-stage').querySelectorAll('[data-oi]');
  if(eds.length){const last=eds[eds.length-1];last.focus();}
}

    +`<button class="btn btn-primary" style="width:100%;margin:10px 0" onclick="newForm()">＋ 새 양식 만들기</button>`;

    const link=formLink(f.code);
    const pgs=pagesOf(f);
    html+=`<div style="background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:10px">`

      +`<div style="flex:1;min-width:0">`
      +`<b style="font-size:15px">${esc3(f.site)||'(이름없음)'}</b> <span style="font-size:11px;font-weight:800;color:${f.active?'var(--green)':'var(--sub)'}">${f.active?'● 사용중':'■ 중지'}</span>`
      +`<div style="font-size:12px;color:var(--sub);margin-top:4px;word-break:break-all">${esc3(link)}</div>`
      +`</div></div>`
      +`<div style="display:grid;gap:8px;margin-top:10px">`
      +`<input id="fs-site-${f.code}" value="${esc3(f.site)}" placeholder="단지 · 현장 이름" style="${IS}">`
      +`<input id="fs-phone-${f.code}" value="${esc3(f.agent_phone)}" placeholder="담당자 전화번호 (문자 받을 번호)" style="${IS}">`
      +`</div>`
      +`<button class="btn btn-ghost" style="width:100%;margin-top:8px;font-size:13.5px;font-weight:800" onclick="openFormEditor('${f.code}')">✏️ 양식 편집 · 미리보기 — 페이지 ${pgs.length}개</button>`
      +`<div style="display:flex;gap:6px;margin-top:10px">`
      +`<button class="btn btn-primary" style="flex:1.2;padding:10px 0;font-size:13.5px" onclick="saveForm('${f.code}')">저장</button>`
      +`<button class="btn btn-ghost" style="flex:1;padding:10px 0;font-size:13.5px" onclick="copyFormLink('${f.code}')">링크 복사</button>`
      +`<button class="btn btn-ghost" style="flex:1;padding:10px 0;font-size:13.5px" onclick="toggleForm('${f.code}',${!f.active})">${f.active?'중지':'사용'}</button>`
      +`<button class="btn btn-danger" style="flex:1;padding:10px 0;font-size:13.5px" onclick="delForm('${f.code}')">삭제</button>`
      +`</div></div>`;
  });
  $('forms-list').innerHTML=html;
}
function openForms(){histPush();loadForms();$('fsheet').classList.add('on');}
function closeForms(){$('fsheet').classList.remove('on');histPop();}
async function newForm(){
  if(!sb||!uid)return toast('로그인이 필요합니다');
  const g=await sb.auth.getUser();
  if(!g.data||!g.data.user)return toast('다시 로그인해 주세요');
  const code=formCode();
  const{error}=await sb.from('forms').insert({
    code:code,user_id:g.data.user.id,site:'새 현장',agent_phone:'',
    types:['59㎡(A)','59㎡(B)','84㎡(A)','84㎡(B)','상관없음'],days:7,intro:'',active:true
  });
  if(error)return toast('만들기 실패 — SQL 설정(webform-setup.sql)을 실행했는지 확인해 주세요');
  toast('양식을 만들었습니다 — 아래에서 내용을 채우세요');
  loadForms();
}
async function saveForm(code){
  if(!sb)return;
  const f=forms.find(x=>x.code===code);if(!f)return;
  const pgs=pagesOf(f);
  pgs.forEach((p,i)=>{
    p.q=($('fp-q-'+code+'-'+i)||{value:p.q}).value.trim();
    p.sub=($('fp-sub-'+code+'-'+i)||{value:p.sub}).value.trim();
    const oe=$('fp-opts-'+code+'-'+i);
    if(oe&&p.type==='select')p.opts=oe.value.split(',').map(x=>x.trim()).filter(Boolean);
  });
  if(!pgs.some(p=>p.type==='contact'))return toast('연락처 페이지는 필수입니다');
  if(!pgs.some(p=>p.type==='date'))return toast('방문일 페이지는 필수입니다');
  const tpg=pgs.find(p=>p.id==='type');
  const patch={
    site:$('fs-site-'+code).value.trim(),
    agent_phone:$('fs-phone-'+code).value.trim(),
    days:(forms[code]&&forms[code].days)||7,
    pages:pgs,
    types:tpg?tpg.opts.map(o=>String(o).split('|')[0]):(f.types||[]),
    intro:tpg?tpg.sub:'',
    updated_at:new Date().toISOString()
  };
  if(!patch.site)return toast('단지 이름을 입력해 주세요');
  const{error}=await sb.from('forms').update(patch).eq('code',code);
  if(error)return toast('저장 실패 — SQL 설정(webform-setup.sql)의 pages 컬럼 추가를 실행했는지 확인해 주세요');
  Object.assign(f,patch);
  renderForms();toast('저장했습니다 — 링크에 즉시 반영됩니다');
}
async function toggleForm(code,val){
  if(!sb)return;
  const{error}=await sb.from('forms').update({active:val,updated_at:new Date().toISOString()}).eq('code',code);
  if(error)return toast('변경 실패');
  loadForms();
}
async function delForm(code){
  if(!confirm('이 양식을 삭제할까요?\n손님에게 보낸 링크는 더 이상 열리지 않습니다.'))return;
  if(!sb)return;
  const{error}=await sb.from('forms').delete().eq('code',code);
  if(error)return toast('삭제 실패');
  loadForms();toast('삭제했습니다');
}
function copyFormLink(code){
  const link=formLink(code);
  const ok=()=>toast('링크를 복사했습니다');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(ok,ok);
  else{const t=document.createElement('textarea');t.value=link;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();ok();}
}

/* ────────── 엑셀 저장 (의존성 없는 최소 XLSX 생성기) ────────── */ /*XLSX_BEGIN*/
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function xlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const d=new Date();
  const dTime=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  const dDate=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  files.forEach(f=>{
    const name=enc.encode(f.name),data=f.data,crc=crc32(data);
    const lh=new ArrayBuffer(30),v=new DataView(lh);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);
    v.setUint16(10,dTime,true);v.setUint16(12,dDate,true);v.setUint32(14,crc,true);
    v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);
    v.setUint16(26,name.length,true);v.setUint16(28,0,true);
    parts.push(new Uint8Array(lh),name,data);
    cen.push({name:name,crc:crc,size:data.length,off:off});
    off+=30+name.length+data.length;
  });
  const cdStart=off;let cdSize=0;
  cen.forEach(c=>{
    const ch=new ArrayBuffer(46),v=new DataView(ch);
    v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(8,0x0800,true);v.setUint16(10,0,true);
    v.setUint16(12,dTime,true);v.setUint16(14,dDate,true);v.setUint32(16,c.crc,true);
    v.setUint32(20,c.size,true);v.setUint32(24,c.size,true);v.setUint16(28,c.name.length,true);
    v.setUint16(30,0,true);v.setUint16(32,0,true);v.setUint16(34,0,true);v.setUint16(36,0,true);
    v.setUint32(38,0,true);v.setUint32(42,c.off,true);
    parts.push(new Uint8Array(ch),c.name);
    cdSize+=46+c.name.length;off+=46+c.name.length;
  });
  const eo=new ArrayBuffer(22),ev=new DataView(eo);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,cen.length,true);ev.setUint16(10,cen.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,cdStart,true);ev.setUint16(20,0,true);
  parts.push(new Uint8Array(eo));
  let total=0;parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total);let p=0;parts.forEach(q=>{out.set(q,p);p+=q.length;});
  return out;
}
function xlsxBuild(rows){
  const enc=new TextEncoder();
  const hdr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+'\n';
  const ct=hdr+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  const rels=hdr+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const wb=hdr+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="예약명단" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const wbR=hdr+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  const st=hdr+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0"/></cellXfs></styleSheet>';
  let body='';
  rows.forEach((r,ri)=>{
    body+='<row r="'+(ri+1)+'">';
    r.forEach((v,ci)=>{
      const ref=String.fromCharCode(65+ci)+(ri+1);
      const txt=xlEsc(v).replace(/\n/g,'&#10;');
      body+='<c r="'+ref+'" t="inlineStr"'+(ri===0?' s="1"':'')+'><is><t xml:space="preserve">'+txt+'</t></is></c>';
    });
    body+='</row>';
  });
  const ws=hdr+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="12" customWidth="1"/><col min="2" max="2" width="16" customWidth="1"/><col min="3" max="3" width="22" customWidth="1"/><col min="4" max="4" width="42" customWidth="1"/></cols><sheetData>'+body+'</sheetData></worksheet>';
  return zipStore([
    {name:'[Content_Types].xml',data:enc.encode(ct)},
    {name:'_rels/.rels',data:enc.encode(rels)},
    {name:'xl/workbook.xml',data:enc.encode(wb)},
    {name:'xl/_rels/workbook.xml.rels',data:enc.encode(wbR)},
    {name:'xl/styles.xml',data:enc.encode(st)},
    {name:'xl/worksheets/sheet1.xml',data:enc.encode(ws)}
  ]);
}
function exportExcel(){
  if(!items.length){toast('저장할 예약이 없습니다');return;}
  const sorted=[...items].sort((a,b)=>startOf(a).localeCompare(startOf(b)));
  const rows=[['이름','전화번호','방문예약날짜','문의내용']];
  sorted.forEach(it=>{
    const ns=it.notes||{before:'',after:'',contract:''};
    const memo=[['[방문전]',ns.before],['[방문후]',ns.after],['[계약]',ns.contract]].filter(x=>x[1]).map(x=>x[0]+' '+x[1]).join('\n');
    rows.push([it.name||'',it.phone||'',(it.date||'')+(it.time?' '+it.time:''),memo]);
  });
  const u8=xlsxBuild(rows);
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([u8],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download='예약명단_'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.xlsx';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('엑셀 파일을 저장했습니다 (총 '+(rows.length-1)+'건)');
}
